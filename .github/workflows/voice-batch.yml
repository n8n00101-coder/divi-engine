name: divi-voice-batch
# Divi Engine — free cloud batch voicing: split a lines file into
# contiguous chunks and run the engine's batch mode on up to 40
# GitHub-hosted runners in parallel (public repos: standard runners
# are free). Each runner loads the model once for its whole chunk and
# runs the self-healing repair loop (best-of-N waves) for its lines.
# Download the merged artifact "divi-voice-batch-all" when the run
# finishes:
#   gh run download <run-id> -n divi-voice-batch-all
# A chunk job can go red when some of its lines never pass the gates —
# its artifact still uploads (if: always) with every passing line's mp3
# plus batch.qc.json naming the failures.
on:
  workflow_dispatch:
    inputs:
      lines_path:
        description: "Lines file in this repo (one line per row)"
        required: true
        type: string
        default: "lines.txt"
      lang:
        description: "Language"
        required: true
        type: choice
        options: [en, te, hi]
        default: en
      chunks:
        description: "Parallel runners (1-40)"
        required: true
        type: string
        default: "40"
      rerolls:
        description: "Extra repair waves per failing line"
        required: true
        type: string
        default: "2"
      candidates:
        description: "Candidates per line per wave (best-of-N)"
        required: false
        type: string
        default: "3"
      backend:
        description: "Backend override (empty = locked default per language; e.g. omnivoice, indicf5-space)"
        required: false
        type: string
        default: ""
      speed:
        description: "USER-REQUESTED tempo factor for this job (empty = LOCKED recipe speed; the tool never adjusts speed on its own)"
        required: false
        type: string
        default: ""
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - name: Split lines into contiguous chunks
        id: split
        env:
          LINES_PATH: ${{ inputs.lines_path }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          python3 - <<'EOF'
          import json, math, os
          lines = [l.strip() for l in open(os.environ["LINES_PATH"]) if l.strip()]
          if not lines:
              raise SystemExit(f"no lines in {os.environ['LINES_PATH']}")
          n = max(1, min(40, int(os.environ["CHUNKS"]), len(lines)))
          per = math.ceil(len(lines) / n)
          os.makedirs("chunks", exist_ok=True)
          used = []
          for ci in range(n):
              part = lines[ci * per:(ci + 1) * per]
              if not part:
                  continue
              with open(f"chunks/chunk-{ci}.txt", "w") as fh:
                  fh.write("\n".join(part) + "\n")
              with open(f"chunks/chunk-{ci}.json", "w") as fh:
                  json.dump({"first_index": ci * per + 1}, fh)
              used.append(ci)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("chunks=" + json.dumps(used) + "\n")
          print(f"{len(lines)} lines -> {len(used)} chunks of <={per}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: chunks
          path: chunks/
  voice:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chunks
          path: chunks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Repeat runs skip the big downloads: pip's wheel cache (torch is
      # ~200 MB) and the Hugging Face model cache both persist across
      # runs, keyed on requirements.txt.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}-torch2.6.0
          restore-keys: |
            pip-${{ runner.os }}-py311-
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt') }}
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg wamerican > /dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -2
          pip install -q httpx -r requirements.txt 2>&1 | tail -3
      - name: Install Resemblyzer (identity gate)
        run: |
          if ! pip install -q resemblyzer==0.1.4 2>resemb_err.log; then
            echo "resemblyzer install failed; trying webrtcvad-wheels fallback"
            cat resemb_err.log | tail -3
            pip install -q webrtcvad-wheels
            pip install -q --no-deps resemblyzer==0.1.4
          fi
          python3 -c "from resemblyzer import VoiceEncoder; print('resemblyzer ok')"
      - name: Generate this chunk (batch mode, model loads once)
        env:
          PYTHONUNBUFFERED: "1"
          CHUNK: ${{ matrix.chunk }}
          LANG: ${{ inputs.lang }}
          REROLLS: ${{ inputs.rerolls }}
          CANDIDATES: ${{ inputs.candidates }}
          BACKEND: ${{ inputs.backend }}
          SPEED: ${{ inputs.speed }}
          # Runners have 4 cores and each chunk runs a single worker:
          # give torch all 4 threads instead of the small-machine default.
          JULIE_CLONE_THREADS: "4"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          FIRST=$(python3 -c "import json; print(json.load(open('chunks/chunk-${CHUNK}.json'))['first_index'])")
          if [ -n "$BACKEND" ]; then export JULIE_TTS_BACKEND="$BACKEND"; fi
          SPEED_ARG=""
          if [ -n "$SPEED" ]; then SPEED_ARG="--speed $SPEED"; fi
          python3 engine.py --batch "chunks/chunk-${CHUNK}.txt" --lang "$LANG" \
            --outdir out --jobs 1 --rerolls "$REROLLS" --candidates "$CANDIDATES" \
            $SPEED_ARG --first-index "$FIRST"
      - name: Name this chunk's QC report (merged artifact keeps them all)
        if: always()
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          # Every chunk writes out/batch.qc.json; without a per-chunk
          # name the merge step's files overwrite each other and only
          # one chunk's report survives.
          if [ -f out/batch.qc.json ]; then
            cp out/batch.qc.json "out/batch.qc.chunk-${CHUNK}.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-chunk-${{ matrix.chunk }}
          path: out/
  merge:
    needs: voice
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-chunk-*
          path: merged
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: divi-voice-batch-all
          path: merged/
